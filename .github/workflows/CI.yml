name: Lint and Format

on: [pull_request, push]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Install NodeJS
              uses: actions/setup-node@v6
              with:
                  node-version: '22'

            - name: Code Checkout
              uses: actions/checkout@v6

            - name: Install Dependencies
              run: npm ci

            - name: Code Linting
              run: npx eslint .

            - name: Code Formatting
              run: npx prettier . --write
